map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_port $upstream_forwarded_port {
    default $http_x_forwarded_port;
    "" $server_port;
}

server {
    listen 80 default_server;
    server_name test.srubai.ru _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header X-Forwarded-Port $upstream_forwarded_port;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header X-Forwarded-Port $upstream_forwarded_port;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
